name: path-policy-ops

# Weekly operations for the postman-cs path policy: drift between the committed rendered rulesets
# and the live org rulesets, a digest of would-fail / failed rule suites, and open bypass requests.
# Needs the repo secret PATH_POLICY_READ_TOKEN (fine-grained PAT, org administration:read). Until
# it exists the job warns and exits 0.

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ISSUE_TITLE: "path-policy: drift or would-fail digest"

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check read token
        id: token
        env:
          TOKEN: ${{ secrets.PATH_POLICY_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::PATH_POLICY_READ_TOKEN is not set; skipping drift check, would-fail digest, and bypass-request steps"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "path-policy-ops skipped: PATH_POLICY_READ_TOKEN is not configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Drift check (rendered vs live rulesets)
        id: drift
        if: steps.token.outputs.enabled == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PATH_POLICY_READ_TOKEN }}
        run: |
          set -o pipefail
          node policy/apply-rulesets.mjs --dry-run | tee drift.json

      - name: Would-fail digest and open bypass requests
        id: digest
        if: steps.token.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.PATH_POLICY_READ_TOKEN }}
        run: policy/ops-digest.sh digest.md

      - name: Job summary
        if: always() && steps.token.outputs.enabled == 'true'
        env:
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
        run: |
          {
            echo "## Drift check: $DRIFT_OUTCOME"
            echo
            if [ -s drift.json ]; then echo '```json'; cat drift.json; echo '```'; fi
            echo
            if [ -f digest.md ]; then cat digest.md; else echo "Digest step did not produce output."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert digest issue
        if: always() && steps.token.outputs.enabled == 'true' && (steps.drift.outcome != 'success' || steps.digest.outputs.would_fail_count != '0')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Generated by [path-policy-ops]($RUN_URL) on $(date -u +%FT%TZ). This issue is updated in place on each run that finds drift or would-fail evaluations."
            echo
            echo "## Drift check: $DRIFT_OUTCOME"
            echo
            if [ -s drift.json ]; then echo '```json'; cat drift.json; echo '```'; fi
            echo
            if [ -f digest.md ]; then cat digest.md; else echo "Digest step did not produce output; see the run log."; fi
          } > issue.md
          existing=$(gh issue list --repo "$REPO" --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body-file issue.md
            echo "updated issue #$existing"
          else
            gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --body-file issue.md
          fi
